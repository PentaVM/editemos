<!doctype html>
<html><head><meta charset="utf-8"><title>brand sheet</title>
<style>
/*FONTS*/
html,body{margin:0;width:1600px;height:1000px;overflow:hidden}
#sheet{position:absolute;inset:0;padding:64px 72px;box-sizing:border-box;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto 1fr auto;gap:36px 64px}
.k{font:15px 'Cascadia Mono',Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;opacity:.62;margin-bottom:16px}
h1{margin:0;font-size:92px;line-height:.98;letter-spacing:-.025em}
.tag{font-size:26px;line-height:1.3;margin-top:18px;opacity:.82;max-width:22em}
.logo{height:92px;max-width:340px;object-fit:contain;object-position:left center;display:block}
.sw{display:flex;gap:14px;flex-wrap:wrap}
.sw div{width:128px}
.sw i{display:block;height:96px;border:1px solid rgba(128,128,128,.35)}
.sw b{display:block;font:15px 'Cascadia Mono',Consolas,monospace;margin-top:9px;font-weight:400}
.sw em{display:block;font-style:normal;font-size:15px;opacity:.6}
.type .a{font-size:74px;line-height:1;letter-spacing:-.02em}
.type .b{font-size:22px;line-height:1.4;margin-top:14px;opacity:.85;max-width:26em}
.type small{font:14px 'Cascadia Mono',Consolas,monospace;opacity:.6;display:block;margin-top:8px}
.curves{display:flex;gap:22px}
.curves div{font:13px 'Cascadia Mono',Consolas,monospace;opacity:.9;text-align:center}
.curves svg{display:block;width:104px;height:104px;border:1px solid rgba(128,128,128,.35);margin-bottom:8px}
.facts{font-size:19px;line-height:1.55}
.facts b{font-weight:600}
.voice{font-size:19px;line-height:1.5;opacity:.85}
footer{grid-column:1/3;display:flex;justify-content:space-between;font:13px 'Cascadia Mono',Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
</style></head><body>
<div id="sheet"></div>
<script>
const B = /*BRAND*/{};
const LOGO = /*LOGO*/null;
const e = B.edit || {}, c = e.colors || {}, tt = e.type_tokens || {};
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
const sheet = document.getElementById('sheet');
const pal = B.palette || [];
const bg = (pal.find((p) => p.role === 'background') || {}).hex || c.bg || '#0e0e10';
const fg = (pal.find((p) => p.role === 'text') || {}).hex || c.fg || '#efe7d8';
sheet.style.background = bg; sheet.style.color = fg;
const head = tt.heading || 'Bahnschrift', body = tt.body || head;
sheet.style.fontFamily = `'${body}', Bahnschrift, 'Segoe UI Variable', sans-serif`;
const curve = (n, b) => { const p = (x, y) => `${(8 + x * 88).toFixed(1)},${(96 - y * 88).toFixed(1)}`; return `<div><svg viewBox="0 0 104 104"><path d="M${p(0, 0)} C${p(b[0], b[1])} ${p(b[2], b[3])} ${p(1, 1)}" fill="none" stroke="${c.accent || '#ff4d2e'}" stroke-width="3.5"/></svg>${n}</div>`; };
const fonts = (B.fonts || []).filter((f) => f.role !== 'other').map((f) => `${f.family} (${f.role})`).join(' · ') || `${head} (derived)`;
sheet.innerHTML = `
  <div>
    ${LOGO ? `<img class="logo" src="${LOGO}">` : ''}
    <h1 style="font-family:'${head}',Bahnschrift,sans-serif;margin-top:${LOGO ? 34 : 0}px">${esc(B.name)}</h1>
    <div class="tag">${esc(B.tagline || B.description || '')}</div>
  </div>
  <div>
    <div class="k">Palette</div>
    <div class="sw">${pal.filter((p) => p.role !== 'neutral').slice(0, 6).map((p) => `<div><i style="background:${esc(p.hex)}"></i><b>${esc(p.hex)}</b><em>${esc(p.role)}</em></div>`).join('')}</div>
  </div>
  <div class="type">
    <div class="k">Type</div>
    <div class="a" style="font-family:'${head}',Bahnschrift,sans-serif">Aa Bb Cc 0123</div>
    <div class="b">${esc((B.voice && B.voice.samples && B.voice.samples[0]) || B.description || 'The quick brown fox jumps over the lazy dog.')}</div>
    <small>${esc(fonts)}</small>
    <div class="k" style="margin-top:34px">Voice</div>
    <div class="voice">${esc(((B.voice || {}).descriptors || []).join(' · ') || 'not analysed yet')}</div>
  </div>
  <div>
    <div class="k">Edit brand · ${esc(e.tempo || '')}</div>
    <div class="curves">${e.easings ? Object.entries(e.easings).map(([k, v]) => curve(k, v)).join('') : ''}</div>
    <div class="facts" style="margin-top:22px">
      <b>Durations</b> ${(e.durations || []).join(' / ')} frames at 30 fps<br>
      <b>Stagger</b> ${e.stagger_ms || 0} ms · <b>Hold</b> ${e.hold_frames || 0} frames<br>
      <b>Transitions</b> ${esc((e.transitions || []).join(', '))}
    </div>
  </div>
  <footer><span>${esc(B.source_url || 'no website read yet')}</span><span>brand sheet · editemos</span></footer>`;
Motion.mount(Motion.timeline(), { duration: 1, fps: 30 });
</script>
</body></html>
