# Curated catalog of third-party agent skills for video editing and motion graphics.
#
# editemos does NOT redistribute these. `editemos skills sync` downloads the text files
# (SKILL.md and references) straight from each upstream repository, pinned to the commit
# it resolved, and records a hash of every file in ~/.editemos/skills.lock.
# Licences were checked from each repository's LICENSE file; the original LICENSE is
# copied next to the downloaded skills.
#
# Fields:
#   id        local name
#   repo      owner/name on GitHub
#   license   SPDX id declared upstream
#   tags      free labels; `cloud` entries send media to a hosted service and are
#             skipped unless you pass --include-cloud
#   only      optional path prefixes; when set, only skill folders under them are taken

